[project]
name = "mandi-vaaz"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aryan", email = "arusinha0710@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "gnani-vachana>=0.9.0",
    "imageio-ffmpeg>=0.7.0",
    "jiwer>=4.0.0",
    "python-multipart>=0.0.33",
    "rapidfuzz>=3.14.6",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
mandi-vaaz = "mandi_vaaz:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
